# CourseLLM web client — nginx server block.
#
# This is a `server {}` fragment, not a complete nginx.conf. docker/web.Dockerfile
# copies it to /etc/nginx/conf.d/default.conf, which the stock nginx.conf includes
# inside its http{} context.
#
# There is no Vercel and no server-side rendering. The build emits static assets,
# nginx serves them here, and in production the same `dist/` directory is synced
# to S3 and served by CloudFront with /api/* routed to the API origin. This file
# is the local/self-hosted delivery mechanism for those same assets.

server {
    # 8080, not 80: the image runs as the non-root nginx user (uid 101), which
    # cannot bind a privileged port. Compose maps ${WEB_PORT:-5173} onto 8080.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Do not advertise the nginx version in responses or error pages.
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/wasm
        image/svg+xml;

    # --- Security headers ---------------------------------------------------
    # Declared once, at server level. Every location below uses `expires` rather
    # than `add_header` for caching, so nginx's add_header inheritance rules do
    # not strip these. HSTS is deliberately absent: this listener is plain HTTP,
    # and HSTS belongs at the TLS terminator (CloudFront/ALB) in production.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # The client is self-hosted and Vite emits external script/style bundles, so
    # no inline script is required. 'unsafe-inline' is allowed for styles only,
    # which several UI libraries need. A deployment that builds with a separate
    # API origin (VITE_API_BASE_URL) must add that origin to connect-src.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    # --- Container liveness -------------------------------------------------
    # This is nginx's own liveness, not the API's /healthz. It asserts only that
    # the static server is answering, and carries no dependency check.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # --- API reverse proxy --------------------------------------------------
    # The local analogue of CloudFront routing /api/* to the API origin. The
    # upstream name is the compose service name. The client calls /api/v1/...
    # with VITE_API_BASE_URL empty, so the browser sees a single origin.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # nginx defaults client_max_body_size to 1 MiB, which would reject
        # document uploads the API accepts up to MAX_UPLOAD_BYTES (25 MiB).
        # Keep this in step with MAX_UPLOAD_BYTES in .env.
        client_max_body_size 25m;
        # Stream request bodies to the API instead of buffering them to nginx's
        # temp directory first; uploads can be tens of megabytes.
        proxy_request_buffering off;
        # Chat responses are server-sent events; buffering them would defeat
        # streaming and make a slow answer look like a hung request.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # --- Hashed static assets ----------------------------------------------
    # Vite emits content-addressed filenames, so these are safe to cache hard.
    # `expires` (rather than add_header) keeps the server-level security headers.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # --- Application shell --------------------------------------------------
    # The shell must be revalidated or a deploy is invisible behind the cached
    # one; the hashed assets it references are immutable, so this is cheap.
    # `expires -1` emits `Cache-Control: no-cache`.
    location = /index.html {
        expires -1;
    }

    # --- SPA fallback -------------------------------------------------------
    # Unknown paths render the client's own route (including its 404 page)
    # instead of nginx's default error page. try_files internally redirects to
    # /index.html, so the no-cache rule above still applies.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
