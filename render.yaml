services:
  # 1. Background Worker (Dramatiq)
  - type: worker
    name: coursellm-worker
    env: docker
    rootDir: coursellm
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter # ML apps need at least starter/standard RAM
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: coursellm-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: coursellm-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
    dockerCommand: "dramatiq workers.orchestrator --processes 1 --threads 4"

  # 2. Web API (FastAPI)
  - type: web
    name: coursellm-api
    env: docker
    rootDir: coursellm
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: coursellm-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: coursellm-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
    # Uvicorn will bind to the PORT variable automatically provided by Render
    dockerCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"

  # The Redis Instance
  - type: redis
    name: coursellm-redis
    plan: free
    ipAllowList: [] # internal only

databases:
  # The Postgres Database
  - name: coursellm-db
    plan: free
