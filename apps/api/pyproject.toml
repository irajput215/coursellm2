[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "coursellm"
version = "0.1.0"
description = "Agentic RAG tutoring platform: hybrid retrieval, knowledge graph, and grounded tutoring over a student's own course material."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

# Runtime dependencies are deliberately split. The `core` set is everything
# needed to run the API, retrieval, fusion, graph, security and evaluation
# layers. Anything that pulls a multi-hundred-megabyte model or a compiler
# toolchain is an extra, so that CI and the default container stay small.
dependencies = [
    # Web framework
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.1",

    # Validation and settings
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "email-validator>=2.1",

    # Persistence
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pgvector>=0.3",

    # Auth
    "pyjwt>=2.8",
    "bcrypt>=4.1",

    # HTTP and utilities
    "httpx>=0.27",
    "tenacity>=8.3",
    "orjson>=3.10",
    "structlog>=24.1",
    "python-dotenv>=1.0",
    "pypdf>=4.2",

    # LLM gateway and agent orchestration
    "litellm>=1.40",
    "langgraph>=0.2",
    "langchain-core>=0.3",

    # Cache and queue
    "redis>=5.0",

    # Observability
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "opentelemetry-exporter-otlp-proto-http>=1.25",
]

[project.optional-dependencies]
# Real sentence-transformer embeddings (pulls torch).
embeddings = [
    "sentence-transformers>=3.0",
]
# Real cross-encoder reranking (pulls torch + transformers).
rerank = [
    "transformers>=4.42",
    "torch>=2.3",
]
# RAGAS-based evaluation. Optional because the native metric engine is the
# default, deterministic path used by CI.
ragas = [
    "ragas>=0.2",
]
langsmith = [
    "langsmith>=0.1.100",
]
# MCP server exposing selected tools to external AI clients.
mcp = [
    "mcp>=1.2",
]
# Durable LangGraph checkpointing in PostgreSQL.
checkpoint-postgres = [
    "langgraph-checkpoint-postgres>=2.0",
]
# Document formats beyond PDF and plain text.
docx = [
    "python-docx>=1.1",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml",
]

[project.scripts]
coursellm = "coursellm.cli:main"

[project.urls]
Repository = "https://github.com/irajput215/coursellm2"

[tool.hatch.build.targets.wheel]
packages = ["src/coursellm"]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "unit: fast, isolated, no external services",
    "integration: requires PostgreSQL (and Redis where stated)",
    "security: adversarial security regression tests",
    "eval: evaluation harness tests; may be slow",
]
filterwarnings = [
    "error::DeprecationWarning:coursellm.*",
]

[tool.coverage.run]
source = ["src/coursellm"]
branch = true
omit = [
    "*/tests/*",
    "*/alembic/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "TID",  # flake8-tidy-imports
    "RUF",  # ruff-specific
    "ASYNC",
    "S",    # flake8-bandit
    "PT",   # flake8-pytest-style
]
ignore = [
    "S101",   # assert is fine in tests
    "B008",   # FastAPI Depends() in defaults is idiomatic
    "RUF012", # ClassVar annotations not required for pydantic models
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311", "PT011"]
"alembic/**" = ["E501", "N999"]

[tool.ruff.lint.isort]
known-first-party = ["coursellm"]

[tool.mypy]
python_version = "3.12"
packages = ["coursellm"]
strict = true
warn_unreachable = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]
# Third-party libraries without stubs. Kept deliberately short.
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
