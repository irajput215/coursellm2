[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# The URL is supplied by alembic/env.py from application settings so that the
# application and migrations can never disagree about the database. This value
# is a placeholder and is intentionally not used.
sqlalchemy.url =

# Formatting of generated revisions is handled by `make fmt` rather than a
# post-write hook, so that the toolchain does not have to be on PATH for
# alembic to succeed (which is not the case inside the container image).

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
