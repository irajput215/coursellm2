<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="CourseLLM — a grounded tutoring workspace over your own course material."
    />
    <title>CourseLLM</title>
    <script>
      // Apply the stored theme before first paint so there is no flash of the
      // wrong colour scheme. Kept inline and dependency-free on purpose.
      (function () {
        try {
          var stored = window.localStorage.getItem('coursellm.theme')
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          var dark = stored === 'dark' || ((stored === null || stored === 'system') && prefersDark)
          document.documentElement.classList.toggle('dark', dark)
        } catch (error) {
          // Private browsing can throw on localStorage; the default light
          // theme is still usable.
          void error
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
