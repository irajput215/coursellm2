# Security controls.
#
# Three independent gates:
#
# * the repository secret scan (`scripts/scan_secrets.sh`) — the control that
#   exists because an earlier revision committed a live credential;
# * `pip-audit` over the installed environment, run weekly as well as on every
#   change, so a newly published advisory is picked up without a code push;
# * `pytest -m security`, because the adversarial prompt-injection corpus is a
#   security control, not a test detail.

name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays 06:17 UTC. The offset avoids the top of the hour, when GitHub's
    # scheduler is busiest.
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v7

      # The scan is bash + grep over tracked files; it needs no Python
      # environment, so it stays fast and cannot be defeated by an install
      # failure.
      - name: Scan tracked files for secret-shaped values
        run: make secrets-scan

  dependency-audit:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('apps/api/pyproject.toml', 'pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install
        run: make install

      # pip-audit runs against the environment it is invoked from, which is the
      # same `.venv` the application uses.
      - name: Audit installed dependencies
        run: make audit-deps

  injection-corpus:
    name: injection corpus
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('apps/api/pyproject.toml', 'pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install
        run: make install

      - name: Adversarial security regression tests
        run: make test-security
